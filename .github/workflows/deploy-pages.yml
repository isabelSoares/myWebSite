name: Deploy portfolio to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts-app/package-lock.json

      - name: Install dependencies
        working-directory: ts-app
        run: npm ci

      - name: Build site
        working-directory: ts-app
        env:
          REACT_APP_AI_ASSISTANT_URL: ${{ vars.AI_ASSISTANT_URL }}
        run: |
          npm run validate:assistant-url
          npm run test:assistant-url
          npm run build

      - name: Support direct client-side routes
        run: cp ts-app/build/index.html ts-app/build/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ts-app/build

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
